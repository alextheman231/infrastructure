name: Change request

on:
  workflow_dispatch:
    inputs:
      reason:
        description: A short explanation for the reason behind the change.
        required: true
        default: Reapply the configuration
      description:
        description: A further description of the change.
        required: false
        default: Trigger a Terraform apply.
      branch_name:
        description: The branch name to use
        required: false
        default: change-request
      labels:
        description: The labels to use on the pull request, given as a comma-separated list
        required: false
        default: "medium risk"

jobs:
  create-change-request:
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.repository == 'alextheman231/infrastructure' }}
    uses: alextheman231/github-actions/.github/workflows/create-change-request.yml@64cb9a86fd3f029229d33d731a5f25ba70d24ba2 # v12.10.0
    with:
      APP_ID: ${{ vars.ALEX_UP_BOT_APP_ID }}
      actor: ${{ github.actor }}
      reason: ${{ inputs.reason }}
      description: ${{ inputs.description }}
      branch_name: ${{ inputs.branch_name }}
      labels: ${{ inputs.labels }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
