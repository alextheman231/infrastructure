name: Apply Terraform Configuration

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_TOKEN_app_terraform_io: ${{ secrets.TFE_TOKEN }}
  TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}

jobs:
  apply:
    if: ${{ github.repository == 'alextheman231/infrastructure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_apply: ${{ steps.verify_plan.outputs.should_apply }}
    steps:
      - name: Do not allow anyone other than AlexMan123456 to directly apply manually
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$GITHUB_ACTOR" !=  "AlexMan123456" ]]; then
            echo "::error::Only AlexMan123456 is allowed to manually apply the configuration."
            exit 1
          fi

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15

      - name: Initialise Terraform
        run: terraform init

      - name: Run the plan
        id: plan
        run: terraform plan -detailed-exitcode -out=tfplan
        continue-on-error: true

      - name: Verify the plan
        id: verify_plan
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          case "$PLAN_EXIT_CODE" in
            "0")
              echo "Plan has no changes. Skipping apply."
              echo "should_apply=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            "2")
              echo "Plan has changes. Prompting an apply."
              echo "should_apply=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              exit "$PLAN_EXIT_CODE"
              ;;
          esac

      - name: Approve and apply the configuration
        if: ${{ steps.verify_plan.outputs.should_apply == 'true' }}
        run: terraform apply tfplan
