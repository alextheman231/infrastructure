name: Scheduled Apply

on:
  schedule:
    - cron: 0 21 * * 5

jobs:
  scheduled-apply:
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.repository == 'alextheman231/infrastructure' }}
    uses: alextheman231/github-actions/.github/workflows/create-change-request.yml@0b57250b2e91ab1fff3a5b65deae7ea25a19b824 # v14.9.1
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      actor: alex-up-bot[bot]
      reason: "Scheduled apply"
      description: "This is a weekly scheduled apply of the Terraform configuration, intended to fix potential state drifts. Please review the plan carefully before merging."
      branch_name: scheduled-apply
      labels: "medium risk,tooling"
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
